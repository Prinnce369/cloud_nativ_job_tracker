services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobsdb}
      POSTGRES_USER: ${POSTGRES_USER:-jobsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobspassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobsuser} -d ${POSTGRES_DB:-jobsdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://jobsuser:jobspassword@db:5432/jobsdb}
      API_PORT: ${API_PORT:-8080}
      NODE_ENV: development
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
